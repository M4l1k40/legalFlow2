global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: legalflow-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:9000']
        labels: { service: gateway }
      - targets: ['client-service:8081']
        labels: { service: client-service }
      - targets: ['case-service:8082']
        labels: { service: case-service }
      - targets: ['appointment-service:8083']
        labels: { service: appointment-service }
      - targets: ['judicial-service:8084']
        labels: { service: judicial-service }
      - targets: ['document-service:8085']
        labels: { service: document-service }
      - targets: ['deadline-service:8086']
        labels: { service: deadline-service }
      - targets: ['notification-service:8087']
        labels: { service: notification-service }
      - targets: ['billing-service:8088']
        labels: { service: billing-service }
      - targets: ['consultation-service:8089']
        labels: { service: consultation-service }
      - targets: ['user-service:8090']
        labels: { service: user-service }
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
