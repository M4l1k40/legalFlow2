groups:
  - name: legalflow
    rules:
      - alert: ServiceDown
        expr: up{job="legalflow-services"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} ne répond plus"
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Plus de 5 % d'erreurs 5xx sur {{ $labels.service }}"
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le, service) (rate(http_server_requests_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Latence p95 supérieure à 1 s sur {{ $labels.service }}"
      - alert: JvmHeapHigh
        expr: sum by (service) (jvm_memory_used_bytes{area="heap"}) / sum by (service) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Mémoire heap > 90 % sur {{ $labels.service }}"
