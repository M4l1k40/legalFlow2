apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: legalflow
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: legalflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: legalflow
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: '9000'
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: gateway
        image: ghcr.io/m4l1k40/lg2/gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: http
        env:
        - name: CLIENT_SERVICE_URL
          value: http://client-service:8081
        - name: CASE_SERVICE_URL
          value: http://case-service:8082
        - name: JUDICIAL_SERVICE_URL
          value: http://judicial-service:8084
        - name: DOCUMENT_SERVICE_URL
          value: http://document-service:8085
        - name: DEADLINE_SERVICE_URL
          value: http://deadline-service:8086
        - name: BILLING_SERVICE_URL
          value: http://billing-service:8088
        - name: CONSULTATION_SERVICE_URL
          value: http://consultation-service:8089
        - name: APPOINTMENT_SERVICE_URL
          value: http://appointment-service:8083
        - name: NOTIFICATION_SERVICE_URL
          value: http://notification-service:8087
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
          value: http://keycloak:8080/realms/legalflow/protocol/openid-connect/certs
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
          valueFrom:
            configMapKeyRef:
              name: legalflow-config
              key: KEYCLOAK_ISSUER_URI
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 5
      volumes:
      - name: tmp
        emptyDir: {}
---
