apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: legalflow
  labels:
    app.kubernetes.io/name: prometheus-config
    app.kubernetes.io/part-of: legalflow
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n\n\
    rule_files:\n  - /etc/prometheus/alerts.yml\n\nscrape_configs:\n  - job_name:\
    \ legalflow-services\n    metrics_path: /actuator/prometheus\n    static_configs:\n\
    \      - targets: ['gateway:9000']\n        labels: { service: gateway }\n   \
    \   - targets: ['client-service:8081']\n        labels: { service: client-service\
    \ }\n      - targets: ['case-service:8082']\n        labels: { service: case-service\
    \ }\n      - targets: ['appointment-service:8083']\n        labels: { service:\
    \ appointment-service }\n      - targets: ['judicial-service:8084']\n        labels:\
    \ { service: judicial-service }\n      - targets: ['document-service:8085']\n\
    \        labels: { service: document-service }\n      - targets: ['deadline-service:8086']\n\
    \        labels: { service: deadline-service }\n      - targets: ['notification-service:8087']\n\
    \        labels: { service: notification-service }\n      - targets: ['billing-service:8088']\n\
    \        labels: { service: billing-service }\n      - targets: ['consultation-service:8089']\n\
    \        labels: { service: consultation-service }\n      - targets: ['user-service:8090']\n\
    \        labels: { service: user-service }\n  - job_name: prometheus\n    static_configs:\n\
    \      - targets: ['localhost:9090']\n"
  alerts.yml: "groups:\n  - name: legalflow\n    rules:\n      - alert: ServiceDown\n\
    \        expr: up{job=\"legalflow-services\"} == 0\n        for: 1m\n        labels:\
    \ { severity: critical }\n        annotations:\n          summary: \"{{ $labels.service\
    \ }} ne r\xE9pond plus\"\n      - alert: HighErrorRate\n        expr: |\n    \
    \      sum by (service) (rate(http_server_requests_seconds_count{status=~\"5..\"\
    }[5m]))\n            / sum by (service) (rate(http_server_requests_seconds_count[5m]))\
    \ > 0.05\n        for: 5m\n        labels: { severity: warning }\n        annotations:\n\
    \          summary: \"Plus de 5 % d'erreurs 5xx sur {{ $labels.service }}\"\n\
    \      - alert: HighLatencyP95\n        expr: |\n          histogram_quantile(0.95,\
    \ sum by (le, service) (rate(http_server_requests_seconds_bucket[5m]))) > 1\n\
    \        for: 10m\n        labels: { severity: warning }\n        annotations:\n\
    \          summary: \"Latence p95 sup\xE9rieure \xE0 1 s sur {{ $labels.service\
    \ }}\"\n      - alert: JvmHeapHigh\n        expr: sum by (service) (jvm_memory_used_bytes{area=\"\
    heap\"}) / sum by (service) (jvm_memory_max_bytes{area=\"heap\"}) > 0.9\n    \
    \    for: 10m\n        labels: { severity: warning }\n        annotations:\n \
    \         summary: \"M\xE9moire heap > 90 % sur {{ $labels.service }}\"\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: legalflow
  labels:
    app.kubernetes.io/name: grafana-provisioning
    app.kubernetes.io/part-of: legalflow
data:
  datasource.yml: "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n\
    \    type: prometheus\n    access: proxy\n    url: http://prometheus:9090\n  \
    \  isDefault: true\n"
  dashboards.yml: "apiVersion: 1\nproviders:\n  - name: LegalFlow\n    folder: LegalFlow\n\
    \    type: file\n    options:\n      path: /var/lib/grafana/dashboards\n"
