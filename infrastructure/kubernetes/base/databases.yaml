apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: legalflow
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: legalflow
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: legalflow
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: legalflow
        - name: POSTGRES_USER
          value: legalflow
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: legalflow-secrets
              key: client-db-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - legalflow
            - -d
            - legalflow
          initialDelaySeconds: 10
          periodSeconds: 10
      securityContext:
        fsGroup: 70
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: legalflow
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: legalflow
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: http
    port: 5432
    targetPort: 5432
