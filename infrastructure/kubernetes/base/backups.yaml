apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: legalflow-backups
  namespace: legalflow
  labels:
    app.kubernetes.io/name: legalflow-backups
    app.kubernetes.io/part-of: legalflow
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres
  namespace: legalflow
  labels:
    app.kubernetes.io/name: backup-postgres
    app.kubernetes.io/part-of: legalflow
spec:
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
          containers:
          - name: backup
            image: postgres:17-alpine
            command:
            - sh
            - -c
            - set -e; mkdir -p /backup/postgres; pg_dump -h postgres -U legalflow
              -d legalflow -Fc -f /backup/postgres/legalflow-$(date +%F).dump; find
              /backup/postgres -name '*.dump' -mtime +14 -delete
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: legalflow-secrets
                  key: client-db-password
            volumeMounts:
            - name: backups
              mountPath: /backup
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: legalflow-backups
---
