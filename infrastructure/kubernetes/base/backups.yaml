apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-minio
  namespace: legalflow
  labels:
    app.kubernetes.io/name: backup-minio
    app.kubernetes.io/part-of: legalflow
spec:
  schedule: 30 2 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
          containers:
          - name: backup
            image: minio/mc:latest
            command:
            - sh
            - -c
            - set -e; mc alias set src http://minio:9000 "$MINIO_USER" "$MINIO_PASS";
              mc mirror --overwrite --remove src/legalflow-documents /backup/minio
            env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: legalflow-secrets
                  key: minio-root-user
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: legalflow-secrets
                  key: minio-root-password
            volumeMounts:
            - name: backups
              mountPath: /backup
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: legalflow-backups
