apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legalflow
  namespace: legalflow
  labels:
    app.kubernetes.io/name: legalflow
    app.kubernetes.io/part-of: legalflow
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
    nginx.ingress.kubernetes.io/limit-rps: '20'
    nginx.ingress.kubernetes.io/limit-burst-multiplier: '5'
    nginx.ingress.kubernetes.io/limit-connections: '40'
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - app.legalflow.example.com
    - api.legalflow.example.com
    - auth.legalflow.example.com
    secretName: legalflow-tls
  rules:
  - host: app.legalflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
  - host: api.legalflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 9000
  - host: auth.legalflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: legalflow
  labels:
    app.kubernetes.io/name: default-deny-ingress
    app.kubernetes.io/part-of: legalflow
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: legalflow
  labels:
    app.kubernetes.io/name: allow-same-namespace
    app.kubernetes.io/part-of: legalflow
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: legalflow
  labels:
    app.kubernetes.io/name: allow-ingress-controller
    app.kubernetes.io/part-of: legalflow
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - frontend
      - gateway
      - keycloak
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: legalflow
  labels:
    app.kubernetes.io/name: gateway-hpa
    app.kubernetes.io/part-of: legalflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: legalflow
  labels:
    app.kubernetes.io/name: frontend-hpa
    app.kubernetes.io/part-of: legalflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: legalflow
  labels:
    app.kubernetes.io/name: gateway-pdb
    app.kubernetes.io/part-of: legalflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: legalflow
  labels:
    app.kubernetes.io/name: frontend-pdb
    app.kubernetes.io/part-of: legalflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
