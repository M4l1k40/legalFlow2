apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: legalflow
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: legalflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: legalflow
      annotations: {}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.0.7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-db:5432/keycloak
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: legalflow-secrets
              key: keycloak-db-password
        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: legalflow-config
              key: KEYCLOAK_ISSUER_URI
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: LEGALFLOW_FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: legalflow-config
              key: LEGALFLOW_FRONTEND_URL
        - name: LEGALFLOW_API_URL
          valueFrom:
            configMapKeyRef:
              name: legalflow-config
              key: LEGALFLOW_API_URL
        - name: KC_SECRET_LEGALFLOW_GATEWAY
          valueFrom:
            secretKeyRef:
              name: legalflow-secrets
              key: kc-secret-legalflow-gateway
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: legalflow-secrets
              key: keycloak-admin-user
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: legalflow-secrets
              key: keycloak-admin-password
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 1536Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: realm
          mountPath: /opt/keycloak/data/import
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 5
        args:
        - start
        - --import-realm
      volumes:
      - name: tmp
        emptyDir: {}
      - name: realm
        configMap:
          name: legalflow-realm
