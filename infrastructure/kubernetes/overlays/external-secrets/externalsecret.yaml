# Chaque clé du Secret est lue dans le coffre sous « legalflow/<clé> ».
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: legalflow-secrets
  namespace: legalflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: legalflow-store
    kind: ClusterSecretStore
  target:
    name: legalflow-secrets
    creationPolicy: Owner
  data:
  - secretKey: appointment-db-password
    remoteRef:
      key: legalflow/appointment-db-password
  - secretKey: billing-db-password
    remoteRef:
      key: legalflow/billing-db-password
  - secretKey: case-db-password
    remoteRef:
      key: legalflow/case-db-password
  - secretKey: client-db-password
    remoteRef:
      key: legalflow/client-db-password
  - secretKey: consultation-db-password
    remoteRef:
      key: legalflow/consultation-db-password
  - secretKey: deadline-db-password
    remoteRef:
      key: legalflow/deadline-db-password
  - secretKey: document-db-password
    remoteRef:
      key: legalflow/document-db-password
  - secretKey: grafana-admin-password
    remoteRef:
      key: legalflow/grafana-admin-password
  - secretKey: grafana-admin-user
    remoteRef:
      key: legalflow/grafana-admin-user
  - secretKey: judicial-db-password
    remoteRef:
      key: legalflow/judicial-db-password
  - secretKey: kc-secret-legalflow-gateway
    remoteRef:
      key: legalflow/kc-secret-legalflow-gateway
  - secretKey: keycloak-admin-client-secret
    remoteRef:
      key: legalflow/keycloak-admin-client-secret
  - secretKey: keycloak-admin-password
    remoteRef:
      key: legalflow/keycloak-admin-password
  - secretKey: keycloak-admin-user
    remoteRef:
      key: legalflow/keycloak-admin-user
  - secretKey: keycloak-db-password
    remoteRef:
      key: legalflow/keycloak-db-password
  - secretKey: mail-password
    remoteRef:
      key: legalflow/mail-password
  - secretKey: mail-username
    remoteRef:
      key: legalflow/mail-username
  - secretKey: minio-root-password
    remoteRef:
      key: legalflow/minio-root-password
  - secretKey: minio-root-user
    remoteRef:
      key: legalflow/minio-root-user
  - secretKey: notification-db-password
    remoteRef:
      key: legalflow/notification-db-password
  - secretKey: notification-service-client-secret
    remoteRef:
      key: legalflow/notification-service-client-secret
  - secretKey: rabbitmq-password
    remoteRef:
      key: legalflow/rabbitmq-password
  - secretKey: whatsapp-access-token
    remoteRef:
      key: legalflow/whatsapp-access-token
